<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HillsByte</title><link rel="stylesheet" href="style.css"></head><body><main><header><b>HILLSBYTE</b><span id="balance">$0.00</span></header><section class="hero"><h1>Earn with HillsByte</h1><p>Complete tasks, submit proof and earn after approval.</p></section><nav><button onclick="show('home')">Home</button><button onclick="show('tasks')">Tasks</button><button onclick="show('profile')">Profile</button></nav><section id="home"><div class="cards"><div><small>Available</small><strong id="bal">$0.00</strong></div><div><small>HillsCoin</small><strong id="coin">0</strong></div></div><h2>How it works</h2><p>Start a task → complete it → submit a screenshot → wait for admin review.</p></section><section id="tasks" hidden><h2>Tasks</h2><div id="taskList">Loading…</div></section><section id="profile" hidden><h2>Profile</h2><input id="email" placeholder="Email"><input id="wallet" placeholder="BEP20 payment address"><button onclick="saveProfile()">Save Profile</button><input id="amount" type="number" min="1" placeholder="Withdrawal amount"><button onclick="withdraw()">Request Withdrawal</button><p id="msg"></p></section></main><script src="app.js"></script></body></html>
