<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HillsByte Admin</title>

<style>
body{
  font-family:system-ui;
  background:#07100b;
  color:#eee;
  max-width:1000px;
  margin:auto;
  padding:20px
}

input,button{
  padding:10px;
  background:#0d1912;
  color:#fff;
  border:1px solid #284333;
  border-radius:8px
}

button{cursor:pointer}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.card{
  background:#0d1912;
  border:1px solid #1d3427;
  border-radius:12px;
  padding:15px;
  margin:10px 0
}

table{
  width:100%;
  border-collapse:collapse
}

td,th{
  padding:9px;
  border-bottom:1px solid #1d3427;
  text-align:left;
  font-size:13px;
  vertical-align:top
}

.proof{
  max-width:180px;
  max-height:220px;
  border-radius:8px;
  object-fit:contain;
  background:#000;
  display:block
}

.approve{
  border-color:#276b3b
}

.reject{
  border-color:#6b2727
}

.status-pending{
  color:#ffd166
}

.status-approved{
  color:#5ee88a
}

.status-rejected{
  color:#ff7777
}

@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  table{font-size:11px}
  td,th{padding:7px}
  .proof{max-width:120px}
}
</style>
</head>

<body>

<h1>HillsByte Admin</h1>

<input id="key" type="password" placeholder="Admin key">
<button onclick="load()">Load</button>

<div id="stats" class="grid"></div>

<!-- WITHDRAWALS -->

<div class="card">
  <h2>Withdrawals</h2>
  <div id="rows">Enter admin key.</div>
</div>

<!-- TASK SUBMISSIONS -->

<div class="card">
  <h2>Task Submissions</h2>
  <div id="submissions">Enter admin key.</div>
</div>

<script>

async function api(u,o={}){
  const r=await fetch(u,{
    ...o,
    headers:{
      'Content-Type':'application/json',
      'x-admin-key':key.value
    }
  });

  const d=await r.json();

  if(!r.ok || d.ok===false){
    throw Error(d.error||'Failed');
  }

  return d;
}


async function load(){

  try{

    /* ADMIN OVERVIEW */

    const s=await api('/api/admin/overview');

    stats.innerHTML=`
      <div class="card">
        <b>${s.users}</b><br>Users
      </div>

      <div class="card">
        <b>${s.pendingWithdrawals}</b><br>Pending withdrawals
      </div>

      <div class="card">
        <b>$${Number(s.paidWithdrawals).toFixed(2)}</b><br>Paid total
      </div>
    `;


    /* WITHDRAWALS */

    const d=await api('/api/admin/withdrawals');

    rows.innerHTML=
      '<table>'+
      '<tr>'+
      '<th>ID</th>'+
      '<th>User</th>'+
      '<th>Amount</th>'+
      '<th>Address</th>'+
      '<th>Status</th>'+
      '<th>Action</th>'+
      '</tr>'+

      d.withdrawals.map(w=>`

        <tr>

          <td>${w.id}</td>

          <td>
            ${w.username||w.telegram_id}
          </td>

          <td>
            $${Number(w.amount).toFixed(2)}
          </td>

          <td style="word-break:break-all">
            ${w.payment_address}
          </td>

          <td>
            ${w.status}
          </td>

          <td>
            <button onclick="setStatus(${w.id},'paid')">
              Paid
            </button>

            <button onclick="setStatus(${w.id},'rejected')">
              Reject
            </button>
          </td>

        </tr>

      `).join('')+
      '</table>';


    /* TASK SUBMISSIONS */

    const ts=await api('/api/admin/task-submissions');

    if(!ts.submissions.length){

      submissions.innerHTML='<p>No task submissions yet.</p>';

    }else{

      submissions.innerHTML=
        '<table>'+
        '<tr>'+
        '<th>ID</th>'+
        '<th>User</th>'+
        '<th>Task</th>'+
        '<th>Reward</th>'+
        '<th>Proof</th>'+
        '<th>Status</th>'+
        '<th>Action</th>'+
        '</tr>'+

        ts.submissions.map(s=>`

          <tr>

            <td>
              ${s.id}
            </td>

            <td>
              ${s.username || s.telegram_id || 'User'}
            </td>

            <td>
              ${s.task_title}
            </td>

            <td>
              $${Number(s.reward).toFixed(2)}
            </td>

            <td>

              ${
                s.proof
                ? `<a href="${s.proof}" target="_blank">
                    <img class="proof" src="${s.proof}" alt="Task proof">
                   </a>`
                : 'No proof'
              }

            </td>

            <td>
              <span class="status-${s.status}">
                ${s.status}
              </span>
            </td>

            <td>

              ${
                s.status==='pending'
                ? `
                  <button class="approve"
                    onclick="reviewSubmission(${s.id},'approved')">
                    Approve
                  </button>

                  <button class="reject"
                    onclick="reviewSubmission(${s.id},'rejected')">
                    Reject
                  </button>
                `
                : 'Reviewed'
              }

            </td>

          </tr>

        `).join('')+
        '</table>';
    }

  }catch(e){

    rows.textContent=e.message;
    submissions.textContent=e.message;

  }
}


/* WITHDRAWAL REVIEW */

async function setStatus(id,status){

  try{

    await api(
      '/api/admin/withdrawals/'+id+'/status',
      {
        method:'POST',
        body:JSON.stringify({status})
      }
    );

    await load();

  }catch(e){

    alert(e.message);

  }
}


/* TASK REVIEW */

async function reviewSubmission(id,status){

  const action=status==='approved'
    ? 'approve this task and credit the reward?'
    : 'reject this task submission?';

  if(!confirm('Are you sure you want to '+action)){
    return;
  }

  try{

    await api(
      '/api/admin/task-submissions/'+id+'/status',
      {
        method:'POST',
        body:JSON.stringify({status})
      }
    );

    await load();

  }catch(e){

    alert(e.message);

  }
}

</script>

</body>
</html>
