<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>HillsByte Admin</title><style>body{font-family:Arial;background:#0b100d;color:#fff;max-width:900px;margin:auto;padding:20px}input,textarea,button{padding:10px;margin:5px;border-radius:8px}input,textarea{background:#121b16;color:#fff;border:1px solid #345}button{cursor:pointer}.box{border:1px solid #294333;border-radius:12px;padding:15px;margin:12px 0}</style></head><body><h1>HillsByte Admin</h1><input id="key" placeholder="Admin key" type="password"><button onclick="load()">Login</button><div id="out"></div><script>let K='';const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-key':K,'Content-Type':'application/json'};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}async function load(){K=$('key').value;try{let o=await api('/api/admin/overview'),t=await api('/api/admin/tasks'),s=await api('/api/admin/task-submissions');$('out').innerHTML=`<div class=box>Users: ${o.users} | Tasks: ${o.tasks} | Pending proofs: ${o.pendingSubmissions}</div><div class=box><h2>Add task</h2><input id=title placeholder=Title><textarea id=desc placeholder=Description></textarea><input id=reward type=number step=0.01 placeholder=Reward><input id=url placeholder=URL><button onclick=add()>Add</button></div>`+t.tasks.map(x=>`<div class=box><b>${x.title}</b> — $${x.reward} — ${x.active?'Active':'Inactive'}<button onclick="toggle(${x.id})">${x.active?'Deactivate':'Activate'}</button><button onclick="del(${x.id})">Delete</button></div>`).join('')+'<h2>Submissions</h2>'+s.submissions.map(x=>`<div class=box>#${x.id} ${x.username||x.first_name||'user'} — ${x.task_title} — ${x.status}<br>${x.proof?'<button onclick="alert(atob(\''+x.proof.split(',').pop()+'\'))">View Proof</button>':''}${x.status==='pending'?`<button onclick="status(${x.id},'approved')">Approve</button><button onclick="status(${x.id},'rejected')">Reject</button>`:''}</div>`).join('')}catch(e){$('out').textContent=e.message}}async function add(){await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title:$('title').value,description:$('desc').value,reward:Number($('reward').value),url:$('url').value})});load()}async function toggle(id){await api('/api/admin/tasks/'+id+'/toggle',{method:'POST'});load()}async function del(id){if(confirm('Delete task?')){await api('/api/admin/tasks/'+id,{method:'DELETE'});load()}}async function status(id,s){await api('/api/admin/task-submissions/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});load()}</script></body></html>
